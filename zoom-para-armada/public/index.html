<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Agenda de Licencias Zoom</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #0B5CFF;
      --primary-dark: #0046CC;
      --secondary: #232333;
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --text: #1E293B;
      --text-light: #64748B;
      --border: #E2E8F0;
      --success: #10B981;
      --success-bg: #ECFDF5;
      --warning: #F59E0B;
      --warning-bg: #FFFBEB;
      --danger: #EF4444;
      --danger-bg: #FEF2F2;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      transition: all 0.2s ease;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 40px 20px;
      line-height: 1.5;
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      text-align: center;
      color: var(--secondary);
      font-weight: 700;
      font-size: 2.5rem;
      margin-bottom: 2rem;
      letter-spacing: -0.025em;
    }

    .contenedor {
      max-width: 1280px;
      margin: auto;
      background: var(--card-bg);
      padding: 32px;
      border-radius: 20px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
    }

    .controles {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      background: #F1F5F9;
      padding: 12px 20px;
      border-radius: 12px;
    }

    button {
      padding: 10px 20px;
      border: none;
      background: var(--primary);
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(11, 92, 255, 0.25);
    }

    button:active {
      transform: translateY(0);
    }

    #mesAnio {
      font-family: 'Outfit', sans-serif;
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--secondary);
    }

    .calendario {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 12px;
    }

    .dia-semana {
      text-align: center;
      font-weight: 600;
      padding: 12px;
      color: var(--text-light);
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .dia {
      min-height: 180px;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      cursor: pointer;
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .dia:hover:not(.bloqueado):not(.vacio) {
      border-color: var(--primary);
      box-shadow: 0 0 0 1px var(--primary);
      background: #FAFBFF;
    }

    .numero {
      font-weight: 700;
      font-size: 1.125rem;
      color: var(--text-light);
      margin-bottom: 4px;
    }

    .vacio {
      background: transparent;
      border: none;
      cursor: default;
    }

    .bloqueado {
      background: #F8FAFC;
      color: #CBD5E1;
      cursor: not-allowed;
      border-style: dashed;
    }

    .texto-bloqueado {
      font-size: 0.75rem;
      font-weight: 500;
      text-align: center;
      margin-top: auto;
      color: #94A3B8;
    }

    .horario {
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      border: 1px solid transparent;
      line-height: 1.4;
      font-weight: 500;
    }

    .horario strong {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 2px;
    }

    .verde {
      background: var(--success-bg);
      color: #065F46;
      border-color: #A7F3D0;
    }

    .amarillo {
      background: var(--warning-bg);
      color: #92400E;
      border-color: #FDE68A;
    }

    .rojo {
      background: var(--danger-bg);
      color: #991B1B;
      border-color: #FECACA;
    }

    .leyenda {
      margin-top: 40px;
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
      background: #F8FAFC;
      padding: 20px;
      border-radius: 16px;
    }

    .item-leyenda {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-light);
    }

    .color {
      width: 16px;
      height: 16px;
      border-radius: 4px;
    }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      z-index: 100;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
    }

    .modal-contenido {
      background: white;
      width: 95%;
      max-width: 560px;
      margin: 60px auto;
      padding: 32px;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      position: relative;
      animation: modalSlide 0.3s ease-out;
    }

    @keyframes modalSlide {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    #tituloModal {
      font-family: 'Outfit', sans-serif;
      margin-top: 0;
      color: var(--secondary);
      font-size: 1.75rem;
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: 600;
      font-size: 0.875rem;
      color: var(--text);
    }

    input, textarea {
      width: 100%;
      padding: 12px 16px;
      margin-top: 6px;
      box-sizing: border-box;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.95rem;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(11, 92, 255, 0.1);
    }

    .fila-horarios {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .acciones-modal {
      margin-top: 32px;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    .btn-rojo {
      background: var(--danger);
    }
    .btn-rojo:hover {
      background: #DC2626;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
    }

    .btn-verde {
      background: var(--success);
    }
    .btn-verde:hover {
      background: #059669;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
    }

    .btn-ghost {
      background: #F1F5F9;
      color: var(--text);
    }
    .btn-ghost:hover {
      background: #E2E8F0;
      box-shadow: none;
    }

    .nota {
      font-size: 0.85rem;
      background: #EFF6FF;
      padding: 12px 16px;
      border-radius: 12px;
      color: #1E40AF;
      border-left: 4px solid var(--primary);
    }

    .mensaje-error {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      background: var(--danger-bg);
      color: var(--danger);
      font-weight: 600;
      font-size: 0.875rem;
      border: 1px solid #FECACA;
    }

    .campo-error {
      border-color: var(--danger);
      background: #FFF5F5;
    }
  </style>
</head>

<body>

  <div class="contenedor">
    <h1>Agenda Zoom Workplace</h1>

    <div class="controles">
      <button onclick="mesAnterior()">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="15 19l-7-7 7-7"/></svg>
        Anterior
      </button>
      <div id="mesAnio"></div>
      <button onclick="mesSiguiente()">
        Siguiente
        <svg width="20" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="9 5l7 7-7 7"/></svg>
      </button>
    </div>

    <div class="calendario" id="calendario"></div>

    <div class="leyenda">
      <div class="item-leyenda">
        <div class="color" style="background:var(--success-bg); border:1px solid #A7F3D0;"></div>
        <span>Disponible (0-1)</span>
      </div>
      <div class="item-leyenda">
        <div class="color" style="background:var(--warning-bg); border:1px solid #FDE68A;"></div>
        <span>Limitado (2)</span>
      </div>
      <div class="item-leyenda">
        <div class="color" style="background:var(--danger-bg); border:1px solid #FECACA;"></div>
        <span>Sin cupo (3)</span>
      </div>
      <div class="item-leyenda">
        <div class="color" style="background:#F1F5F9; border:1px dashed #CBD5E1;"></div>
        <span>No habilitado</span>
      </div>
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-contenido">
      <h2 id="tituloModal">Editar reunión</h2>

      <input type="hidden" id="fechaSeleccionada">
      <input type="hidden" id="reservaId">

      <div class="nota">
        Cada solicitud utiliza <strong>1 licencia</strong>. Horario: <strong>08:00 - 14:00</strong>.
      </div>

      <div id="mensajeError" class="mensaje-error"></div>

      <div class="fila-horarios">
        <div>
          <label>Inicio</label>
          <input type="time" id="horaInicio" min="08:00" max="13:59">
        </div>

        <div>
          <label>Fin</label>
          <input type="time" id="horaFin" min="08:01" max="14:00">
        </div>
      </div>

      <label>Motivo de uso</label>
      <input type="text" id="motivo" placeholder="Ej: Reunión de coordinación">

      <label>Responsable</label>
      <input type="text" id="responsable" placeholder="Nombre completo">

      <div class="fila-horarios">
        <div>
          <label>Unidad</label>
          <input type="text" id="unidad" placeholder="Ej: RRHH">
        </div>
        <div>
          <label>Gran Mando</label>
          <input type="text" id="granMando">
        </div>
      </div>

      <label>Observaciones</label>
      <textarea id="observaciones" placeholder="Detalles adicionales..."></textarea>

      <div class="acciones-modal">
        <button class="btn-ghost" onclick="cerrarModal()">Cancelar</button>
        <button class="btn-rojo" id="btnEliminar" onclick="eliminarReserva()">Eliminar</button>
        <button class="btn-verde" onclick="guardarReserva()">Guardar Solicitud</button>
      </div>
    </div>
  </div>


  <script>
    var fechaActual = new Date();
    var mesActual = fechaActual.getMonth();
    var anioActual = fechaActual.getFullYear();
    var reservas = [];

    var meses = [
      "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio",
      "Julio", "Agosto", "Setiembre", "Octubre", "Noviembre", "Diciembre"
    ];

    var diasSemana = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];

    function cargarReservas() {
      var mesApi = mesActual + 1;

      fetch("/api/reservas?anio=" + anioActual + "&mes=" + mesApi)
        .then(function(respuesta) {
          if (!respuesta.ok) {
            throw new Error("No se pudo conectar con la API.");
          }

          return respuesta.json();
        })
        .then(function(datos) {
          if (Array.isArray(datos)) {
            reservas = datos;
          } else {
            reservas = [];
          }

          generarCalendario();
        })
        .catch(function(error) {
          console.log("Error al cargar reservas:", error);

          reservas = [];

          generarCalendario();
        });
    }

    function generarCalendario() {
      var calendario = document.getElementById("calendario");
      var mesAnio = document.getElementById("mesAnio");

      calendario.innerHTML = "";
      mesAnio.innerHTML = meses[mesActual] + " " + anioActual;

      for (var i = 0; i < diasSemana.length; i++) {
        var diaSemana = document.createElement("div");
        diaSemana.className = "dia-semana";
        diaSemana.innerHTML = diasSemana[i];
        calendario.appendChild(diaSemana);
      }

      var primerDia = new Date(anioActual, mesActual, 1).getDay();
      var diasDelMes = new Date(anioActual, mesActual + 1, 0).getDate();

      for (var j = 0; j < primerDia; j++) {
        var vacio = document.createElement("div");
        vacio.className = "dia vacio";
        calendario.appendChild(vacio);
      }

      for (var dia = 1; dia <= diasDelMes; dia++) {
        crearDia(dia);
      }
    }

    function crearDia(dia) {
      var calendario = document.getElementById("calendario");
      var fecha = obtenerFechaTexto(dia);
      var fechaObjeto = new Date(anioActual, mesActual, dia);
      var numeroDiaSemana = fechaObjeto.getDay();

      var divDia = document.createElement("div");

      if (numeroDiaSemana === 0 || numeroDiaSemana === 6) {
        divDia.className = "dia bloqueado";
        divDia.innerHTML =
          "<div class='numero'>" + dia + "</div>" +
          "<div class='texto-bloqueado'>No habilitado</div>";
        calendario.appendChild(divDia);
        return;
      }

      divDia.className = "dia";
      divDia.onclick = function() {
        abrirModalNuevo(dia);
      };

      var contenido = "<div class='numero'>" + dia + "</div>";
      var reservasDelDia = obtenerReservasDelDia(fecha);

      if (reservasDelDia.length === 0) {
        contenido += "<div class='horario verde'>Sin reuniones cargadas</div>";
      } else {
        for (var i = 0; i < reservasDelDia.length; i++) {
          var reserva = reservasDelDia[i];
          var ocupacion = calcularOcupacion(reserva);

          contenido +=
            "<div class='horario " + obtenerClaseColor(ocupacion) + "' onclick='abrirModalExistente(event, " + reserva.id + ")'>" +
            "<strong>" + reserva.horario + "</strong><br>" +
            "Ocupación: " + ocupacion + "/3";

          if (reserva.unidad) {
            contenido += "<br>" + reserva.unidad;
          }

          if (reserva.responsable) {
            contenido += "<br>" + reserva.responsable;
          }

          contenido += "</div>";
        }
      }

      divDia.innerHTML = contenido;
      calendario.appendChild(divDia);
    }

    function abrirModalNuevo(dia) {
      var fecha = obtenerFechaTexto(dia);

      limpiarErrores();

      document.getElementById("fechaSeleccionada").value = fecha;
      document.getElementById("reservaId").value = "";
      document.getElementById("tituloModal").innerHTML = "Nueva solicitud - " + fecha;

      document.getElementById("horaInicio").value = "08:00";
      document.getElementById("horaFin").value = "10:00";
      document.getElementById("motivo").value = "";
      document.getElementById("responsable").value = "";
      document.getElementById("unidad").value = "";
      document.getElementById("granMando").value = "";
      document.getElementById("observaciones").value = "";

      document.getElementById("modal").style.display = "block";
    }

    function abrirModalExistente(evento, id) {
      evento.stopPropagation();

      limpiarErrores();

      var reserva = buscarReservaPorId(id);

      if (reserva === null) {
        return;
      }

      document.getElementById("fechaSeleccionada").value = reserva.fecha;
      document.getElementById("reservaId").value = reserva.id;
      document.getElementById("tituloModal").innerHTML = "Editar solicitud - " + reserva.fecha;

      document.getElementById("horaInicio").value = reserva.hora_inicio;
      document.getElementById("horaFin").value = reserva.hora_fin;
      document.getElementById("motivo").value = reserva.motivo || "";
      document.getElementById("responsable").value = reserva.responsable || "";
      document.getElementById("unidad").value = reserva.unidad || "";
      document.getElementById("granMando").value = reserva.gran_mando || "";
      document.getElementById("observaciones").value = reserva.observaciones || "";

      document.getElementById("modal").style.display = "block";
    }

    function cerrarModal() {
      document.getElementById("modal").style.display = "none";
      limpiarErrores();
    }

    function guardarReserva() {
      limpiarErrores();

      var id = document.getElementById("reservaId").value;
      var fecha = document.getElementById("fechaSeleccionada").value;
      var horaInicio = document.getElementById("horaInicio").value;
      var horaFin = document.getElementById("horaFin").value;
      var motivo = document.getElementById("motivo").value.trim();
      var responsable = document.getElementById("responsable").value.trim();
      var unidad = document.getElementById("unidad").value.trim();
      var granMando = document.getElementById("granMando").value.trim();
      var observaciones = document.getElementById("observaciones").value.trim();

      if (!validarCampos(horaInicio, horaFin, motivo, responsable, unidad, granMando)) {
        return;
      }

      var datos = {
        id: id,
        fecha: fecha,
        hora_inicio: horaInicio,
        hora_fin: horaFin,
        motivo: motivo,
        responsable: responsable,
        unidad: unidad,
        gran_mando: granMando,
        observaciones: observaciones
      };

      fetch("/api/reservas", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(datos)
      })
      .then(function(respuesta) {
        return respuesta.json().then(function(data) {
          return {
            ok: respuesta.ok,
            data: data
          };
        });
      })
      .then(function(resultado) {
        if (!resultado.ok) {
          mostrarError(resultado.data.error || "No se pudo guardar la solicitud.");
          return;
        }

        cerrarModal();
        cargarReservas();
      })
      .catch(function(error) {
        console.log(error);
        mostrarError("Error al guardar la solicitud.");
      });
    }

    function eliminarReserva() {
      limpiarErrores();

      var id = document.getElementById("reservaId").value;

      if (id === "") {
        mostrarError("Esta solicitud todavía no fue guardada.");
        return;
      }

      var confirmar = confirm("¿Seguro que desea eliminar esta solicitud?");

      if (!confirmar) {
        return;
      }

      fetch("/api/reservas/" + id, {
        method: "DELETE"
      })
      .then(function(respuesta) {
        return respuesta.json();
      })
      .then(function() {
        cerrarModal();
        cargarReservas();
      })
      .catch(function(error) {
        console.log(error);
        mostrarError("Error al eliminar la solicitud.");
      });
    }

    function validarCampos(horaInicio, horaFin, motivo, responsable, unidad, granMando) {
      if (horaInicio === "") {
        marcarCampoError("horaInicio");
        mostrarError("Debe ingresar la hora de inicio.");
        return false;
      }

      if (horaFin === "") {
        marcarCampoError("horaFin");
        mostrarError("Debe ingresar la hora de fin.");
        return false;
      }

      var inicio = convertirHoraAMinutos(horaInicio);
      var fin = convertirHoraAMinutos(horaFin);
      var minimo = convertirHoraAMinutos("08:00");
      var maximo = convertirHoraAMinutos("14:00");

      if (inicio < minimo) {
        marcarCampoError("horaInicio");
        mostrarError("La hora de inicio no puede ser menor a 08:00.");
        return false;
      }

      if (fin > maximo) {
        marcarCampoError("horaFin");
        mostrarError("La hora de fin no puede superar las 14:00.");
        return false;
      }

      if (fin <= inicio) {
        marcarCampoError("horaFin");
        mostrarError("La hora de fin debe ser mayor a la hora de inicio.");
        return false;
      }

      if (motivo === "") {
        marcarCampoError("motivo");
        mostrarError("Debe ingresar el motivo de uso.");
        return false;
      }

      if (responsable === "") {
        marcarCampoError("responsable");
        mostrarError("Debe ingresar el responsable.");
        return false;
      }

      if (unidad === "") {
        marcarCampoError("unidad");
        mostrarError("Debe ingresar la unidad.");
        return false;
      }

      if (granMando === "") {
        marcarCampoError("granMando");
        mostrarError("Debe ingresar el Gran Mando.");
        return false;
      }

      return true;
    }

    function mostrarError(mensaje) {
      var mensajeError = document.getElementById("mensajeError");
      mensajeError.innerHTML = mensaje;
      mensajeError.style.display = "block";
    }

    function limpiarErrores() {
      var mensajeError = document.getElementById("mensajeError");
      mensajeError.innerHTML = "";
      mensajeError.style.display = "none";

      document.getElementById("horaInicio").classList.remove("campo-error");
      document.getElementById("horaFin").classList.remove("campo-error");
      document.getElementById("motivo").classList.remove("campo-error");
      document.getElementById("responsable").classList.remove("campo-error");
      document.getElementById("unidad").classList.remove("campo-error");
      document.getElementById("granMando").classList.remove("campo-error");
    }

    function marcarCampoError(idCampo) {
      document.getElementById(idCampo).classList.add("campo-error");
    }

    function obtenerReservasDelDia(fecha) {
      var resultado = [];

      for (var i = 0; i < reservas.length; i++) {
        if (reservas[i].fecha === fecha) {
          resultado.push(reservas[i]);
        }
      }

      resultado.sort(function(a, b) {
        return a.hora_inicio.localeCompare(b.hora_inicio);
      });

      return resultado;
    }

    function calcularOcupacion(reservaBase) {
      var cantidad = 0;

      var baseInicio = convertirHoraAMinutos(reservaBase.hora_inicio);
      var baseFin = convertirHoraAMinutos(reservaBase.hora_fin);

      for (var i = 0; i < reservas.length; i++) {
        var reserva = reservas[i];

        if (reserva.fecha !== reservaBase.fecha) {
          continue;
        }

        var inicio = convertirHoraAMinutos(reserva.hora_inicio);
        var fin = convertirHoraAMinutos(reserva.hora_fin);

        var seSuperpone = baseInicio < fin && baseFin > inicio;

        if (seSuperpone) {
          cantidad++;
        }
      }

      return cantidad;
    }

    function buscarReservaPorId(id) {
      for (var i = 0; i < reservas.length; i++) {
        if (parseInt(reservas[i].id) === parseInt(id)) {
          return reservas[i];
        }
      }

      return null;
    }

    function obtenerClaseColor(cantidad) {
      if (cantidad >= 3) {
        return "rojo";
      }

      if (cantidad === 2) {
        return "amarillo";
      }

      return "verde";
    }

    function convertirHoraAMinutos(hora) {
      var partes = hora.split(":");
      var horas = parseInt(partes[0]);
      var minutos = parseInt(partes[1]);

      return horas * 60 + minutos;
    }

    function obtenerFechaTexto(dia) {
      var mes = mesActual + 1;

      var mesTexto = mes.toString().padStart(2, "0");
      var diaTexto = dia.toString().padStart(2, "0");

      return anioActual + "-" + mesTexto + "-" + diaTexto;
    }

    function mesAnterior() {
      mesActual--;

      if (mesActual < 0) {
        mesActual = 11;
        anioActual--;
      }

      cargarReservas();
    }

    function mesSiguiente() {
      mesActual++;

      if (mesActual > 11) {
        mesActual = 0;
        anioActual++;
      }

      cargarReservas();
    }

    cargarReservas();
  </script>

</body>
