<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calendario de Disponibilidad Zoom</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #0B5CFF;
      --secondary: #232333;
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --text: #1E293B;
      --text-light: #64748B;
      --border: #E2E8F0;
      --success: #10B981;
      --warning: #F59E0B;
      --danger: #EF4444;
      --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      transition: all 0.2s ease;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 40px 20px;
    }

    .contenedor {
      max-width: 1100px;
      margin: auto;
      background: var(--card-bg);
      padding: 40px;
      border-radius: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      text-align: center;
      color: var(--secondary);
      font-size: 2.25rem;
      margin-bottom: 2rem;
      font-weight: 700;
    }

    .controles {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      background: #F1F5F9;
      padding: 12px 24px;
      border-radius: 16px;
    }

    button {
      padding: 10px 20px;
      border: none;
      background: var(--secondary);
      color: white;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button:hover {
      background: #334155;
      transform: translateY(-1px);
    }

    #mesAnio {
      font-family: 'Outfit', sans-serif;
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--secondary);
    }

    .calendario {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 12px;
    }

    .dia-semana {
      text-align: center;
      font-weight: 600;
      padding: 12px;
      color: var(--text-light);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .dia {
      min-height: 100px;
      padding: 12px;
      border-radius: 16px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .numero {
      font-weight: 700;
      font-size: 1.25rem;
      z-index: 2;
    }

    .vacio {
      background: transparent;
      border: none;
    }

    .bloqueado {
      background: #F1F5F9;
      color: #CBD5E1;
      border-style: dashed;
    }

    .verde {
      background: #ECFDF5;
      color: #065F46;
      border-color: #A7F3D0;
    }

    .amarillo {
      background: #FFFBEB;
      color: #92400E;
      border-color: #FDE68A;
    }

    .rojo {
      background: #FEF2F2;
      color: #991B1B;
      border-color: #FECACA;
    }

    .leyenda {
      margin-top: 40px;
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
      background: #F8FAFC;
      padding: 20px;
      border-radius: 16px;
    }

    .item-leyenda {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-light);
    }

    .color {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      border: 1px solid rgba(0,0,0,0.1);
    }
  </style>
</head>

<body>

  <div class="contenedor">
    <h1>Disponibilidad de Licencias</h1>

    <div class="controles">
      <button onclick="mesAnterior()">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="15 19l-7-7 7-7"/></svg>
        Anterior
      </button>
      <div id="mesAnio"></div>
      <button onclick="mesSiguiente()">
        Siguiente
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="9 5l7 7-7 7"/></svg>
      </button>
    </div>

    <div class="calendario" id="calendario"></div>

    <div class="leyenda">
      <div class="item-leyenda">
        <div class="color" style="background:#ECFDF5; border-color:#A7F3D0;"></div>
        <span>3 Disponibles</span>
      </div>
      <div class="item-leyenda">
        <div class="color" style="background:#FFFBEB; border-color:#FDE68A;"></div>
        <span>1 o 2 Disponibles</span>
      </div>
      <div class="item-leyenda">
        <div class="color" style="background:#FEF2F2; border-color:#FECACA;"></div>
        <span>Sin Cupo</span>
      </div>
      <div class="item-leyenda">
        <div class="color" style="background:#F1F5F9; border-color:#CBD5E1; border-style:dashed;"></div>
        <span>No habilitado</span>
      </div>
    </div>
  </div>


  <script>
    var fechaActual = new Date();
    var mesActual = fechaActual.getMonth();
    var anioActual = fechaActual.getFullYear();
    var reservas = [];

    var meses = [
      "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio",
      "Julio", "Agosto", "Setiembre", "Octubre", "Noviembre", "Diciembre"
    ];

    var diasSemana = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];

    function cargarReservas() {
      var mesApi = mesActual + 1;

      fetch("/api/reservas?anio=" + anioActual + "&mes=" + mesApi)
        .then(function(respuesta) {
          if (!respuesta.ok) {
            throw new Error("No se pudo conectar con la API.");
          }

          return respuesta.json();
        })
        .then(function(datos) {
          if (Array.isArray(datos)) {
            reservas = datos;
          } else {
            reservas = [];
          }

          generarCalendario();
        })
        .catch(function(error) {
          console.log("Error al cargar reservas:", error);

          reservas = [];

          generarCalendario();
        });
    }

    function generarCalendario() {
      var calendario = document.getElementById("calendario");
      var mesAnio = document.getElementById("mesAnio");

      calendario.innerHTML = "";
      mesAnio.innerHTML = meses[mesActual] + " " + anioActual;

      for (var i = 0; i < diasSemana.length; i++) {
        var diaSemana = document.createElement("div");
        diaSemana.className = "dia-semana";
        diaSemana.innerHTML = diasSemana[i];
        calendario.appendChild(diaSemana);
      }

      var primerDia = new Date(anioActual, mesActual, 1).getDay();
      var diasDelMes = new Date(anioActual, mesActual + 1, 0).getDate();

      for (var j = 0; j < primerDia; j++) {
        var vacio = document.createElement("div");
        vacio.className = "dia vacio";
        calendario.appendChild(vacio);
      }

      for (var dia = 1; dia <= diasDelMes; dia++) {
        crearDia(dia);
      }
    }

    function crearDia(dia) {
      var calendario = document.getElementById("calendario");
      var fecha = obtenerFechaTexto(dia);
      var fechaObjeto = new Date(anioActual, mesActual, dia);
      var numeroDiaSemana = fechaObjeto.getDay();

      var divDia = document.createElement("div");

      if (numeroDiaSemana === 0 || numeroDiaSemana === 6) {
        divDia.className = "dia bloqueado";
        divDia.innerHTML = "<div class='numero'>" + dia + "</div>";
        calendario.appendChild(divDia);
        return;
      }

      var ocupacionMaxima = obtenerOcupacionMaximaDelDia(fecha);
      var disponibles = 3 - ocupacionMaxima;

      divDia.className = "dia " + obtenerClaseColorPorDisponibilidad(disponibles);
      divDia.innerHTML = "<div class='numero'>" + dia + "</div>";

      calendario.appendChild(divDia);
    }

    function obtenerOcupacionMaximaDelDia(fecha) {
      var reservasDelDia = [];

      for (var i = 0; i < reservas.length; i++) {
        if (reservas[i].fecha === fecha) {
          reservasDelDia.push(reservas[i]);
        }
      }

      if (reservasDelDia.length === 0) {
        return 0;
      }

      var ocupacionMaxima = 0;

      for (var j = 0; j < reservasDelDia.length; j++) {
        var reservaBase = reservasDelDia[j];
        var inicioBase = convertirHoraAMinutos(reservaBase.hora_inicio);
        var finBase = convertirHoraAMinutos(reservaBase.hora_fin);

        var ocupacion = 0;

        for (var k = 0; k < reservasDelDia.length; k++) {
          var otraReserva = reservasDelDia[k];
          var inicioOtra = convertirHoraAMinutos(otraReserva.hora_inicio);
          var finOtra = convertirHoraAMinutos(otraReserva.hora_fin);

          var seSuperpone = inicioBase < finOtra && finBase > inicioOtra;

          if (seSuperpone) {
            ocupacion++;
          }
        }

        if (ocupacion > ocupacionMaxima) {
          ocupacionMaxima = ocupacion;
        }
      }

      return ocupacionMaxima;
    }

    function obtenerClaseColorPorDisponibilidad(disponibles) {
      if (disponibles === 3) {
        return "verde";
      }

      if (disponibles === 1 || disponibles === 2) {
        return "amarillo";
      }

      return "rojo";
    }

    function convertirHoraAMinutos(hora) {
      var partes = hora.split(":");
      var horas = parseInt(partes[0]);
      var minutos = parseInt(partes[1]);

      return horas * 60 + minutos;
    }

    function obtenerFechaTexto(dia) {
      var mes = mesActual + 1;

      var mesTexto = mes.toString().padStart(2, "0");
      var diaTexto = dia.toString().padStart(2, "0");

      return anioActual + "-" + mesTexto + "-" + diaTexto;
    }

    function mesAnterior() {
      mesActual--;

      if (mesActual < 0) {
        mesActual = 11;
        anioActual--;
      }

      cargarReservas();
    }

    function mesSiguiente() {
      mesActual++;

      if (mesActual > 11) {
        mesActual = 0;
        anioActual++;
      }

      cargarReservas();
    }

    cargarReservas();
  </script>

</body>
</html>
